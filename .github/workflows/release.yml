name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test-package:
    name: Build, test, package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build and run test gate; publish win-x64
        shell: pwsh
        run: ./CI/build-release.ps1 -Configuration Release -Runtime win-x64

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-logs
          path: |
            CI/Logs/*.log
            CI/Logs/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: R-D_Gen_doc-win-x64
          path: |
            CI/Output/*.zip
            CI/Output/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified GitHub Release
    needs: build-test-package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: R-D_Gen_doc-win-x64
          path: dist

      - name: Verify SHA256 before publication
        shell: bash
        run: |
          cd dist
          sha256sum -c *.sha256

      - name: Publish tag release or main-branch preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" dist/*.zip dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "R-D Gen Doc $tag" \
              --generate-notes
          else
            tag="snapshot-${GITHUB_RUN_NUMBER}"
            gh release create "$tag" dist/*.zip dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "R-D Gen Doc snapshot $GITHUB_RUN_NUMBER" \
              --notes "Automated Windows x64 standalone preview from main (commit $GITHUB_SHA). Build and tests passed; SHA256 verified."
          fi
